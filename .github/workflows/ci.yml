name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: imsda_events
          POSTGRES_USER: imsda
          POSTGRES_PASSWORD: imsda_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imsda -d imsda_events"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://imsda:imsda_ci@localhost:5432/imsda_events?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      # Fails when prisma/schema.prisma and the committed migration history
      # disagree (#513) — otherwise `prisma migrate dev` silently produces
      # unrelated DROP/RENAME statements for the next migration.
      - name: Check for schema/migration drift
        env:
          PGPASSWORD: imsda_ci
        run: |
          psql -h localhost -U imsda -d imsda_events -c "CREATE DATABASE imsda_events_shadow;"
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://imsda:imsda_ci@localhost:5432/imsda_events_shadow?schema=public" \
            --exit-code
      - run: npm run db:seed
      - run: npm run verify
      # Real-database check that Honors Weekend class seats hold under concurrent saves (#359).
      - run: npm run test:honor-capacity
      # Real-database check of "Group" registration on a club event (#650): never a club or church, no roster, billing contact recorded, shared class and location seats under concurrent saves, the contact's reopen-and-change path re-validating ages and seats.
      - run: npm run test:group-registration
      # Real-database check of revising a published form: a draft beside the live version keeps public and club registration open, withdraw closes both, edits delete tests, each version needs its own test, and concurrent save/publish, save/withdraw and test/save through the form-row lock never mutate a published version or leave a stale valid test (#564).
      - run: npm run test:form-revisions
      # Real-database check of the one-active-act-as-per-session index and racing starts (#442).
      - run: npm run test:staff-act-as
      # Real-database check of club member transfers: unique indexes, transfer back, duplicate recipients, removal orders (#489).
      - run: npm run test:club-transfers

      # Real-database check of the #527 background-check list migration and matching:
      # statuses unchanged across the migration, refreshes, and a re-upload (#527).
      - run: npm run test:background-check-list

      # Real-database round trip of the full club supply reference file (#531).
      - run: npm run test:club-supplies

      # Real-database check of the form 89 club import: current-year default, 48 in 48 listed,
      # one import per club and year, and moving an import to another year with no new people (#541).
      - run: npm run test:club-imports

      # Real-database round trip of club order fulfillment: idempotent need
      # syncing, order/stock math, receiving, awarding never below zero, and
      # an idempotent Honors Weekend write-back (#487).
      - run: npm run test:club-orders

      # Real-database check of uniform ordering on the club order layer: bulk
      # needs, order math with stock and extras, receive/issue, "already has
      # one", a combined honors + uniforms batch, and double-tap safety (#497).
      - run: npm run test:uniform-orders

      # Real-database check of earned awards on the same order layer: insignia
      # suggested and added only on confirmation, event patches for attendees
      # only, multi-group Master Award rules (staff-edited and audited), one
      # batch with honors and uniforms, and double-tap safety (#532).
      - run: npm run test:earned-awards

      # Real-database check of the audited honor-entry void: status, awards and needs
      # skip voided entries, double and racing voids, DB CHECKs, and the Honors Weekend
      # write-back never re-creating a voided completion (#591).
      - run: npm run test:honor-entry-void

      # Real-database check of event templates: apply, revision isolation, save/publish
      # races, parallel same-key applies, key reuse, and sticky archive (#152).
      - run: npm run test:event-templates

      # Real-database check of reviewed annual event cloning: a populated source clones
      # configuration only, excluded domains, disabled modules, stale sources, parallel
      # duplicates, and key reuse (#157).
      - run: npm run test:event-cloning

      # Real-database check of church-sponsored promo codes: linking rules, the
      # owed line per redemption, cancellation dropping it, parallel redemptions,
      # and no double billing on church-billed events (#545).
      - run: npm run test:church-promo-codes

      # Real-database check of locations inside one event: the required pick on a
      # real club submit, per-location capacity under the location row lock (two
      # clubs racing for the last seats, exactly one wins), per-location closing
      # dates and last days, changing location on a director edit, a held lock
      # timing out as a retryable busy, the location filters and CSV columns,
      # and cloning with shifted dates (#413).
      - run: npm run test:event-locations
      # Real-database check of location waitlists: a full location waitlists the club there in per-location order, a freed seat promotes the next club at that location only and never overfills it under races, a busy location is skipped, and the daily digest reaches the active coordinator and event administrators once a day while an email failure changes nothing (#599).
      - run: npm run test:location-waitlist

      # Real-database check of club forms: templates start off and stay invisible to clubs until enabled, sensitive answers are sealed at rest and in no audit, outbox or CSV row, role visibility (director, other club, Area Coordinator, staff with and without VIEW_SENSITIVE_DATA), one audit row per view, and a single-use private link that stores only a token hash, submits exactly once when many submits race, expires, can be withdrawn, and is rate limited (#610).
      - run: npm run test:club-forms

      # Real-database check of the Pathfinder Health Record: switched off stores nothing (the script turns the flag on only inside its own process), every field is sealed on its own and appears in no stored or audit row, one audit row per view, a single-use private link that submits exactly once under a race, Needs update by club year, and removal erasing every year's record (#611).
      - run: npm run test:health-records

      # Real-database check of roster guardian contacts: slot constraints, replace-on-edit, prior-year writes refused, deletion on removal, reader scoping, and no guardian value in any audit row (#510).
      - run: npm run test:club-roster-guardians

      # Real-database check of billing responsibility and organization billing contacts: the resolver is idempotent and race-safe, staff decisions survive re-resolution, one active contact per organization even under parallel replacement with history kept, the constraints and append-only history hold, and no audit row holds contact details (#165).
      - run: npm run test:billing-responsibility

      # Real-database check of attendance reconciliation: only checked-in people are billed (no-shows counted, not billed) with the #409 credit applied to those who attended, idempotent and race-safe prepares and approvals, immutable approved versions that attendance changes after approval leave untouched, append-only corrections with one active per person, and no audit row holding a reason or name (#166).
      - run: npm run test:attendance-reconciliation

      # Real-database check of module requests: one pending per event and module under concurrent submits, approve enables in one transaction, decline needs a reason, audit holds ids only, and free text cannot become an email placeholder (#741).
      - run: npm run test:module-requests

      # Real-database check of Honors Weekend sessions at sites: per-site names beside the
      # no-site rule, copying and cloning by site name with the no-match warning (#589).
      - run: npm run test:honor-sites

      # Real-database check of deleting an event at any stage: a rich event
      # (registrations, payments, honors, forms, messages, locations, club forms,
      # amendment ledgers) is removed in one transaction with no leftover rows
      # anywhere, shared people/clubs/accounts survive, permissions and the typed
      # name are enforced, the audit row holds counts only, a mid-deletion failure
      # rolls everything back, and the ledger trigger flag never leaks (#620).
      - run: npm run test:event-deletion

      # Real-database check of the eAdventist organizations import and church map
      # locations (#649, #724). It creates, migrates and drops its own scratch
      # database on this same Postgres service (the CI role may create databases),
      # so it cannot touch the seeded data above (#740).
      - run: npm run test:eadventist-import

      # The four HTTP suites below call the real public routes, so they need the
      # app running. `npm run verify` just built it; start that build against the
      # same migrated and seeded database. `next start` runs in production mode,
      # which requires these values: they are fictitious, exist only for this
      # throwaway job, and no email is ever delivered (events use local capture).
      # Fictitious CI-only values for production mode. Keep this block identical
      # to the one in the other job ("badge-print" / "verify").
      - name: Start the built app
        env:
          MANAGE_LINK_DERIVATION_SECRET: ci-only-manage-link-derivation-secret-0000000
          ATTENDEE_PASS_SIGNING_SECRET: ci-only-attendee-pass-signing-secret-000000
          RATE_LIMIT_HASH_SECRET: ci-only-rate-limit-hash-secret-0000000000
          OUTBOX_SWEEP_TOKEN: ci-only-outbox-sweep-token-000000000000
          SECRET_ENCRYPTION_KEY: ci-only-secret-encryption-key-00000000000
          ACCOUNT_EMAIL_SENDER_ADDRESS: events@ci.example.test
          RESEND_API_KEY: ci-placeholder-never-sent
        run: |
          nohup npm run start > app.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/; then exit 0; fi
            sleep 2
          done
          echo "The app did not start:" && cat app.log && exit 1

      # Each suite creates its own throwaway event with dates relative to today
      # (#740), so none depends on a seeded event whose deadlines have passed.
      # Concurrent submits for the last seat: exactly one 201 and one 409.
      - run: npm run test:public-capacity
      # Hash-only private access links: resolve, contact-only updates, revocation.
      - run: npm run test:public-access
      # Locally captured confirmation and internal notification messages.
      - run: npm run test:public-messaging
      # Roster registrations: attendee limits and per-attendee capacity.
      - run: npm run test:public-roster

      - name: Show the app log when a suite failed
        if: failure()
        run: cat app.log || true

  # Real-browser check of the printable name badge page (#717, #740). It needs a
  # browser and two packages that are deliberately not dependencies
  # (playwright-core, pdfjs-dist), so it is its own job and is not part of
  # `verify`: a browser or runner problem shows up here and never hides, or
  # fails, the main gate. GitHub-hosted runners ship Google Chrome, which this
  # job drives instead of downloading a browser. `--no-save` keeps the
  # lockfile untouched.
  badge-print:
    name: Badge print (real browser, optional)
    runs-on: ubuntu-latest
    # Optional: a browser or runner flake must not turn the run red.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: imsda_events
          POSTGRES_USER: imsda
          POSTGRES_PASSWORD: imsda_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imsda -d imsda_events"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://imsda:imsda_ci@localhost:5432/imsda_events?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npm i --no-save playwright-core@1.56.1 pdfjs-dist@4.10.38
      # Fictitious CI-only values for production mode. Keep this block identical
      # to the one in the other job ("badge-print" / "verify").
      - name: Start the built app
        env:
          MANAGE_LINK_DERIVATION_SECRET: ci-only-manage-link-derivation-secret-0000000
          ATTENDEE_PASS_SIGNING_SECRET: ci-only-attendee-pass-signing-secret-000000
          RATE_LIMIT_HASH_SECRET: ci-only-rate-limit-hash-secret-0000000000
          OUTBOX_SWEEP_TOKEN: ci-only-outbox-sweep-token-000000000000
          SECRET_ENCRYPTION_KEY: ci-only-secret-encryption-key-00000000000
          ACCOUNT_EMAIL_SENDER_ADDRESS: events@ci.example.test
          RESEND_API_KEY: ci-placeholder-never-sent
        run: |
          nohup npm run start > app.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/; then exit 0; fi
            sleep 2
          done
          echo "The app did not start:" && cat app.log && exit 1
      - name: Check name badge printing
        env:
          BADGE_PRINT_BROWSER: /usr/bin/google-chrome
          BADGE_PRINT_OUT_DIR: ${{ runner.temp }}/badge-print
        run: npm run test:badge-print
      - name: Keep the printed PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badge-print-output
          path: ${{ runner.temp }}/badge-print
          if-no-files-found: ignore
      - name: Show the app log when the check failed
        if: failure()
        run: cat app.log || true
