name: CI

# GitHub Actions minutes are limited (#ci-minutes, Caleb Oct 5, 2026):
# - every pull request runs the full gate ("verify");
# - a push to main (a merge) runs only the quick "main-smoke" job, because the
#   pull request already ran the full gate on the merged code;
# - the full gate also runs once a week on main, and can be started by hand,
#   to catch anything two back-to-back merges broke together.
# The badge-print browser check lives in badge-print.yml and runs only when
# badge or print files change.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: imsda_events
          POSTGRES_USER: imsda
          POSTGRES_PASSWORD: imsda_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imsda -d imsda_events"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://imsda:imsda_ci@localhost:5432/imsda_events?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      # Fails when prisma/schema.prisma and the committed migration history
      # disagree (#513) — otherwise `prisma migrate dev` silently produces
      # unrelated DROP/RENAME statements for the next migration.
      - name: Check for schema/migration drift
        env:
          PGPASSWORD: imsda_ci
        run: |
          psql -h localhost -U imsda -d imsda_events -c "CREATE DATABASE imsda_events_shadow;"
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://imsda:imsda_ci@localhost:5432/imsda_events_shadow?schema=public" \
            --exit-code
      - run: npm run db:seed
      # The lodging property templates are code data synced after migrations (#198).
      - run: npm run lodging:sync
      - run: npm run verify
      # Real-database check that Honors Weekend class seats hold under concurrent saves (#359).
      - run: npm run test:honor-capacity
      # Real-database check of "Group" registration on a club event (#650): never a club or church, no roster, billing contact recorded, shared class and location seats under concurrent saves, the contact's reopen-and-change path re-validating ages and seats.
      - run: npm run test:group-registration
      # Real-database check of revising a published form: a draft beside the live version keeps public and club registration open, withdraw closes both, edits delete tests, each version needs its own test, and concurrent save/publish, save/withdraw and test/save through the form-row lock never mutate a published version or leave a stale valid test (#564).
      - run: npm run test:form-revisions
      # Real-database check of the one-active-act-as-per-session index and racing starts (#442).
      - run: npm run test:staff-act-as
      # Real-database check of the read-only single-account dry run (#554): staff/attendee pairs by normalised email, the conflicts and per-side counts, masked emails by default, PostgreSQL refusing writes in its read-only transaction, and no row, updatedAt or checksum changed anywhere it reads.
      - run: npm run test:single-account-dry-run
      # Real-database check of club member transfers: unique indexes, transfer back, duplicate recipients, removal orders (#489).
      - run: npm run test:club-transfers

      # Real-database check of the #527 background-check list migration and matching:
      # statuses unchanged across the migration, refreshes, and a re-upload (#527).
      - run: npm run test:background-check-list

      # Real-database round trip of the full club supply reference file (#531).
      - run: npm run test:club-supplies

      # Real-database check of the form 89 club import: current-year default, 48 in 48 listed,
      # one import per club and year, and moving an import to another year with no new people (#541).
      - run: npm run test:club-imports

      # Real-database check of new club applications (#817): a public submission waits and creates nothing; the notice goes to the configured address with only the club, church and director names and a link; system administrators and Area Coordinators see the queue and attachment but only administrators decide; the director's Sterling Volunteers status and possible duplicates are flagged; approving makes the club and its director invite exactly once even when approvals race; declining emails the reason; a private link stores only its token hash and works once; audit rows hold ids only.
      - run: npm run test:new-club-application

      # Real-database check of who may sponsor a club (#822): an active church, company or group is accepted and a school, camp, inactive company or club is refused, on create, edit and the club profile; pickers list the kind; church-billed charges and the billing contact go to a company sponsor.
      - run: npm run test:organization-sponsors

      # Real-database round trip of club order fulfillment: idempotent need
      # syncing, order/stock math, receiving, awarding never below zero, and
      # an idempotent Honors Weekend write-back (#487).
      - run: npm run test:club-orders

      # Real-database check of uniform ordering on the club order layer: bulk
      # needs, order math with stock and extras, receive/issue, "already has
      # one", a combined honors + uniforms batch, and double-tap safety (#497).
      - run: npm run test:uniform-orders

      # Real-database check of earned awards on the same order layer: insignia
      # suggested and added only on confirmation, event patches for attendees
      # only, multi-group Master Award rules (staff-edited and audited), one
      # batch with honors and uniforms, and double-tap safety (#532).
      - run: npm run test:earned-awards

      # Real-database check of the audited honor-entry void: status, awards and needs
      # skip voided entries, double and racing voids, DB CHECKs, and the Honors Weekend
      # write-back never re-creating a voided completion (#591).
      - run: npm run test:honor-entry-void

      # Real-database check of event templates: apply, revision isolation, save/publish
      # races, parallel same-key applies, key reuse, and sticky archive (#152).
      - run: npm run test:event-templates

      # Real-database check of reviewed annual event cloning: a populated source clones
      # configuration only, excluded domains, disabled modules, stale sources, parallel
      # duplicates, and key reuse (#157).
      - run: npm run test:event-cloning

      # Real-database check of the public event page content blocks: every kind saves and
      # reads back, custom HTML is stored sanitized and system-administrator only (a refused
      # save changes nothing), block images must be the event's own uploaded images and are
      # public only while published, an image a block shows cannot be deleted, drafts stay
      # off the public listing, and deleting an event removes its blocks (#816).
      - run: npm run test:event-content-blocks

      # Real-database check of church-sponsored promo codes: linking rules, the
      # owed line per redemption, cancellation dropping it, parallel redemptions,
      # and no double billing on church-billed events (#545).
      - run: npm run test:church-promo-codes

      # Real-database check of locations inside one event: the required pick on a
      # real club submit, per-location capacity under the location row lock (two
      # clubs racing for the last seats, exactly one wins), per-location closing
      # dates and last days, changing location on a director edit, a held lock
      # timing out as a retryable busy, the location filters and CSV columns,
      # and cloning with shifted dates (#413).
      - run: npm run test:event-locations
      # Real-database check of lodging inventory (#198): idempotent and concurrent template sync with no names or prices, night-by-night availability with partial stays, closures and unavailable units, per-event overrides, holds that keep append-only history and refuse overlapping active holds under a race, optional finance-only rates, and cascade on event deletion.
      - run: npm run test:lodging
      # Real-database check of lodging preferences, roommate requests and household rules (#199): versioned requests that keep every earlier version, a registrant deadline that staff changes can pass and are flagged for, a full type refused at selection and one winner when five registrants race for the last place, directional roommate requests that are mutual only when both ask or staff approve and never reveal who asked or any contact detail, yes/no accessibility flags with no free-text column that staff without sensitive access neither see nor set, keep-together/split/keep-apart rules that keep history and follow a household change, the review queue, the lodging step of the real public registration (first version from the form, per-night and flat-for-the-event charges as their own line, no line without a rate, rooms for a party, a full type refused at submit with one winner under a race and against a private-page save, church-billed events never charged, a waitlisted choice kept unpriced, lodging never discounted by a promo code, change requests rather than repricing after submission), and the database refusing cross-event rows and rewrites.
      - run: npm run test:lodging-preferences
      # Real-database check of lodging assignment, moves, the waitlist and the attendee display (#200): capacity enforced night by night under the unit locks and the capacity version (five staff racing for the last bed leave one winner, one person raced into two rooms ends in one, a closure racing an assignment stays coherent, and the check fails when the locks are removed), partial stays, held, unavailable and special-use rooms, moves that split a stay with append-only history and a reason and actor, cancellation, late arrival, early departure and transfer that release or keep capacity on purpose, a room closed or lowered after assignment shown as a conflict, alternate housing and expected guests that link to a registration later, a proposal and a CSV import that preview first and apply only exactly what was previewed, accessibility flags only with sensitive access, occupancy by night reproduced and drilled to assignments, the lodging waitlist (explicit idempotent offers one email each through the outbox, reserved places, expired offers, accept, decline, promote), the attendee display (first-name roommates, adults of other registrations only, no contact detail), versioned room notices that become obsolete, no change to any registration's charge, and every row going with its event.
      - run: npm run test:lodging-assignment
      # Real-database check that a lodging change on a church-sponsored registration updates the church's bill automatically (#813): the sponsor's share of each staff edit moves the church's amount owed in the same transaction (increase, decrease and revert, 50% and 100% codes, an approved change request), the registrant's total and recorded discount are untouched, an amendment never erases it, the church-owed lines, CSV and overview agree, every change is audited with ids and amounts only, concurrent edits never double count, and a finalized church invoice is never revised or moved but flagged for the finance office, who see and clear the flag.
      - run: npm run test:church-sponsor-lodging
      # Real-database check of calendar bulk changes (#796): the feed's advisory lock is taken and rows are read again under it, a racing feed sync never leaves a removed entry published and a bulk hide survives it, the 500-entry cap, and a refresh keeping a bulk-set category with no local-edit mark.
      - run: npm run test:calendar-bulk
      # Real-database check of location waitlists: a full location waitlists the club there in per-location order, a freed seat promotes the next club at that location only and never overfills it under races, a busy location is skipped, and the daily digest reaches the active coordinator and event administrators once a day while an email failure changes nothing (#599).
      - run: npm run test:location-waitlist

      # Real-database check of club forms: templates start off and stay invisible to clubs until enabled, sensitive answers are sealed at rest and in no audit, outbox or CSV row, role visibility (director, other club, Area Coordinator, staff with and without VIEW_SENSITIVE_DATA), one audit row per view, and a single-use private link that stores only a token hash, submits exactly once when many submits race, expires, can be withdrawn, and is rate limited (#610).
      - run: npm run test:club-forms

      # Real-database check of the Pathfinder Health Record: switched off stores nothing (the script turns the flag on only inside its own process), every field is sealed on its own and appears in no stored or audit row, one audit row per view, a single-use private link that submits exactly once under a race, Needs update by club year, and removal erasing every year's record (#611).
      - run: npm run test:health-records

      # Real-database check of roster guardian contacts: slot constraints, replace-on-edit, prior-year writes refused, deletion on removal, reader scoping, and no guardian value in any audit row (#510).
      - run: npm run test:club-roster-guardians

      # Real-database check of billing responsibility and organization billing contacts: the resolver is idempotent and race-safe, staff decisions survive re-resolution, one active contact per organization even under parallel replacement with history kept, the constraints and append-only history hold, and no audit row holds contact details (#165).
      - run: npm run test:billing-responsibility

      # Real-database check of attendance reconciliation: only checked-in people are billed (no-shows counted, not billed) with the #409 credit applied to those who attended, idempotent and race-safe prepares and approvals, immutable approved versions that attendance changes after approval leave untouched, append-only corrections with one active per person, and no audit row holding a reason or name (#166).
      - run: npm run test:attendance-reconciliation

      # Real-database check of declared guardian authority: the registrant's choice is the only source of a responsible adult (household, canManage, surname, email and account holder create none), one ACTIVE declaration per minor even under parallel writes, append-only rows with supersede and revoke, the trigger refusing an adult who is not on the registration, minor status at the event start date, two adults claiming one minor becoming a review item, staff changes scoped to the event, and no audit row holding a reason or name (#131).
      - run: npm run test:guardian-authority

      # Real-database check of deferred-organization invoices: drafts only from a current approved reconciliation, numbers assigned exactly once under parallel and retried finalization (per event, code and year), immutable finalized versions with one receivable each, contact-only and amount revisions with the Finalize invoices rule, and no audit row holding a contact name or email (#167).
      - run: npm run test:invoices

      # Real-database check of invoice delivery (#168): one stored, hash-checked PDF per finalized version, sends with the exact recipients and the same attachment on every resend, superseded versions refused, bounce and suppression recorded, append-only AR postings and payments (partial, void, overpaid, carried across a revision), statements scoped to the event, a formula-safe treasurer CSV, and no audit row holding an address or a contact name.
      - run: npm run test:invoice-delivery

      # Real-database check of Amazon SES delivery (#861) against a local SMTP stand-in (no AWS): one message through the outbox worker with an attachment, an inline picture and a QR per attendee, throttling and daily-quota retries, a final 554 rejection, an authentication failure, and STARTTLS required.
      - run: npm run test:ses-delivery

      # Real-database check of announcement emails (#824): each attendee's own seminar choices in ranked order, one labelled QR per attendee, paragraph spacing, and a real test naming a registration showing no sample value.
      - run: npm run test:announcement-email

      # Real-database check of attachments, embedded pictures and button links in announcement emails (#824), through a local stand-in for the email provider: files stored under generated names after a byte check, the 10 MB and 20 MB limits, attachments carried forward between template versions, the announcement's and the template's files and an inline part for the picture and each attendee's QR reaching the adapter with the HTML rewritten to cid:, a retry and a staff retry copy sending the same parts, and an audit trail of file names and sizes only.
      - run: npm run test:announcement-attachments

      # Real-database check of unsubscribe and email preferences for event announcements (#838), through a local stand-in for the email provider: a one-click opt-out (RFC 8058, no login or CSRF token) and the page's choices skipping an address for this event or for all events in the review and the send with the skipped counted by kind, another event's opt-out changing nothing, an opt-out recorded after the broadcast was queued still honoured at delivery with a recorded reason and an audit row holding no address, an announcement marked essential by an event manager (audited) reaching opted-out addresses, a payment receipt never affected and carrying no unsubscribe link, List-Unsubscribe and List-Unsubscribe-Post headers and a signed link on every announcement, an altered token or a GET recording nothing, and re-subscribing clearing the opt-out.
      - run: npm run test:announcement-unsubscribe

      # Real-database check of "Retry failed" after a provider quota (#860), through a local stand-in for the email provider: a 429 daily quota recorded as PROVIDER_QUOTA with a staff-readable reason and a backoff in hours, a bulk send where some guests were sent and some failed, a preview naming every skip, one new copy for each failed guest and none for anyone who was sent the email, nothing sent inside the request, a re-post and a double click adding no second copy, exactly one email per guest once the worker has run, and an audit row with ids and counts only.
      - run: npm run test:retry-failed

      # Real-database check of module requests: one pending per event and module under concurrent submits, approve enables in one transaction, decline needs a reason, audit holds ids only, and free text cannot become an email placeholder (#741).
      - run: npm run test:module-requests

      # Real-database check of Honors Weekend sessions at sites: per-site names beside the
      # no-site rule, copying and cloning by site name with the no-match warning (#589).
      - run: npm run test:honor-sites

      # Real-database check that one Honors Weekend class can teach several honors (#812): the
      # migration's backfill, the database refusing an honor twice in a session or twice across
      # all sessions at a site (whichever class teaches it), one seat per enrollment however many
      # honors, adding and removing honors after clubs enroll (and the refusal after write-back), each honor completed once, and races on seats,
      # honor edits and write-backs.
      - run: npm run test:multi-honor-classes

      # Real-database check of deleting an event at any stage: a rich event
      # (registrations, payments, honors, forms, messages, locations, club forms,
      # amendment ledgers) is removed in one transaction with no leftover rows
      # anywhere, shared people/clubs/accounts survive, permissions and the typed
      # name are enforced, the audit row holds counts only, a mid-deletion failure
      # rolls everything back, and the ledger trigger flag never leaks (#620).
      - run: npm run test:event-deletion

      # Real-database check of PBE registration (#809): the starter template, several
      # named teams per club, the name unique per event (also under concurrent
      # submits), team size 2 to 7 with one alternate, the age-as-of date, a person
      # or coach on one team only (also under concurrency), director edits, the
      # settings guards and the table constraints, level results with audit, the
      # filled and blank print form, billing/church/packet/QR/check-in views per
      # team, and an event without team rules behaving exactly as before.
      - run: npm run test:pbe-registration

      # Check-in desk concurrency (#825): 4 devices checking in the same attendee,
      # the same retry key re-sent, and different attendees of one registration at
      # once, plus check-in racing undo and double undo. One record and one audit
      # entry each, "already checked in by <name>" for the others, never an error.
      - run: npm run test:check-in-concurrency

      # Real-database check of the eAdventist organizations import and church map
      # locations (#649, #724). It creates, migrates and drops its own scratch
      # database on this same Postgres service (the CI role may create databases),
      # so it cannot touch the seeded data above (#740).
      - run: npm run test:eadventist-import

      # The four HTTP suites below call the real public routes, so they need the
      # app running. `npm run verify` just built it; start that build against the
      # same migrated and seeded database. `next start` runs in production mode,
      # which requires these values: they are fictitious, exist only for this
      # throwaway job, and no email is ever delivered (events use local capture).
      # Fictitious CI-only values for production mode. Keep this block identical
      # to the one in badge-print.yml.
      - name: Start the built app
        env:
          MANAGE_LINK_DERIVATION_SECRET: ci-only-manage-link-derivation-secret-0000000
          ATTENDEE_PASS_SIGNING_SECRET: ci-only-attendee-pass-signing-secret-000000
          RATE_LIMIT_HASH_SECRET: ci-only-rate-limit-hash-secret-0000000000
          OUTBOX_SWEEP_TOKEN: ci-only-outbox-sweep-token-000000000000
          SECRET_ENCRYPTION_KEY: ci-only-secret-encryption-key-00000000000
          ACCOUNT_EMAIL_SENDER_ADDRESS: events@ci.example.test
          RESEND_API_KEY: ci-placeholder-never-sent
        run: |
          nohup npm run start > app.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/; then exit 0; fi
            sleep 2
          done
          echo "The app did not start:" && cat app.log && exit 1

      # Each suite creates its own throwaway event with dates relative to today
      # (#740), so none depends on a seeded event whose deadlines have passed.
      # Concurrent submits for the last seat: exactly one 201 and one 409.
      - run: npm run test:public-capacity
      # Hash-only private access links: resolve, contact-only updates, revocation.
      - run: npm run test:public-access
      # Locally captured confirmation and internal notification messages.
      - run: npm run test:public-messaging
      # Roster registrations: attendee limits and per-attendee capacity.
      - run: npm run test:public-roster
      # Lodging assignment through the built app (#200): the private page shows a published room and roommates by first name only, nothing before publishing, the registrant waitlist route needs a private link and the same origin, and every staff route refuses a signed-out caller.
      - run: npm run test:lodging-assignment-http
      # One staff account on four devices (#825): four cookie jars sign in at once
      # (password and second step), then scan in parallel with no 401, 403, 429 or
      # 500, an address change mid-session, re-sent scans, check-in racing undo,
      # the small live-list poll, and every session still valid at the end.
      - run: npm run test:check-in-multi-device-http

      - name: Show the app log when a suite failed
        if: failure()
        run: cat app.log || true

  # Quick check after a merge to main: install, migrate a clean database with the
  # drift check, seed, then lint, type-check and unit tests. No production build,
  # real-database suites or HTTP suites; the pull request already ran those.
  main-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: imsda_events
          POSTGRES_USER: imsda
          POSTGRES_PASSWORD: imsda_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imsda -d imsda_events"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://imsda:imsda_ci@localhost:5432/imsda_events?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - name: Check for schema/migration drift
        env:
          PGPASSWORD: imsda_ci
        run: |
          psql -h localhost -U imsda -d imsda_events -c "CREATE DATABASE imsda_events_shadow;"
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://imsda:imsda_ci@localhost:5432/imsda_events_shadow?schema=public" \
            --exit-code
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
