name: Docker image

# Builds the production image on GitHub and publishes it to GitHub Container
# Registry, so the server pulls a finished image instead of compiling Next for
# 40 minutes on a 4 GB host. Runs after each merge to main and by hand.
#
#   ghcr.io/duranttl/imsda-events:<full commit sha>   (deploy this one)
#   ghcr.io/duranttl/imsda-events:main                 (latest main)
#
# The build arguments are public values baked into metadata and response
# headers (no secrets). Set them as repository variables; the defaults below are
# the production values. Secrets are only ever supplied at runtime (env files).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_BASE_URL=${{ vars.APP_BASE_URL || 'https://events.imsda.org' }}
            EMBED_ALLOWED_ORIGINS=${{ vars.EMBED_ALLOWED_ORIGINS || '''self'' https://imsda.org https://*.imsda.org' }}
            SQUARE_ENVIRONMENT=${{ vars.SQUARE_ENVIRONMENT || 'sandbox' }}
            SQUARE_ENABLE_PRODUCTION=${{ vars.SQUARE_ENABLE_PRODUCTION || 'false' }}
            APP_RELEASE_SHA=${{ github.sha }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo '```'
            echo "${{ steps.name.outputs.image }}:${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
