services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: imsda_events
      POSTGRES_USER: imsda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - imsda_events_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imsda -d imsda_events"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://imsda:${POSTGRES_PASSWORD}@postgres:5432/imsda_events?schema=public
      APP_BASE_URL: ${APP_BASE_URL}
      MANAGE_LINK_DERIVATION_SECRET: ${MANAGE_LINK_DERIVATION_SECRET}
      MANAGE_LINK_DERIVATION_SECRET_PREVIOUS: ${MANAGE_LINK_DERIVATION_SECRET_PREVIOUS:-}
      ATTENDEE_PASS_SIGNING_SECRET: ${ATTENDEE_PASS_SIGNING_SECRET}
      ATTENDEE_PASS_SIGNING_SECRET_PREVIOUS: ${ATTENDEE_PASS_SIGNING_SECRET_PREVIOUS:-}
      RATE_LIMIT_HASH_SECRET: ${RATE_LIMIT_HASH_SECRET}
      RATE_LIMIT_TRUSTED_PROXY_HOPS: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:-1}
      RATE_LIMIT_CLIENT_IP_HEADER: ${RATE_LIMIT_CLIENT_IP_HEADER:-x-forwarded-for}
      EMBED_ALLOWED_ORIGINS: ${EMBED_ALLOWED_ORIGINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      SQUARE_ENVIRONMENT: ${SQUARE_ENVIRONMENT:-sandbox}
      SQUARE_APPLICATION_ID: ${SQUARE_APPLICATION_ID:-}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-}
      SQUARE_API_URL: ${SQUARE_API_URL:-https://connect.squareupsandbox.com}
      SQUARE_API_VERSION: ${SQUARE_API_VERSION:-2026-07-15}
      SQUARE_WEBHOOK_SIGNATURE_KEY: ${SQUARE_WEBHOOK_SIGNATURE_KEY:-}
      SQUARE_WEBHOOK_NOTIFICATION_URL: ${SQUARE_WEBHOOK_NOTIFICATION_URL:-}
      SQUARE_ENABLE_PRODUCTION: ${SQUARE_ENABLE_PRODUCTION:-false}
      OUTBOX_SWEEP_TOKEN: ${OUTBOX_SWEEP_TOKEN}
    ports:
      - "${APP_PORT:-3100}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # Nothing else sweeps the outbox on a timer. Without this, a message that
  # fails its first attempt waits for a staff member to open Communications.
  outbox-sweeper:
    image: curlimages/curl:8.11.1
    depends_on:
      app:
        condition: service_healthy
    environment:
      OUTBOX_SWEEP_TOKEN: ${OUTBOX_SWEEP_TOKEN}
      OUTBOX_SWEEP_URL: http://app:3000/api/internal/outbox/sweep
      OUTBOX_SWEEP_INTERVAL_SECONDS: ${OUTBOX_SWEEP_INTERVAL_SECONDS:-300}
    volumes:
      - ./scripts/outbox-sweep.sh:/usr/local/bin/outbox-sweep.sh:ro
    entrypoint: ["sh", "/usr/local/bin/outbox-sweep.sh"]
    restart: unless-stopped

  # Nightly pg_dump with retention, plus a periodic restore into a scratch
  # database. A backup that has never been restored is not a backup.
  backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: imsda
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: imsda_events
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_VERIFY_EVERY: ${BACKUP_VERIFY_EVERY:-7}
      # Optional. Receives the dump path as $$1, e.g. "rclone copy $$1 remote:imsda".
      BACKUP_OFFSITE_COMMAND: ${BACKUP_OFFSITE_COMMAND:-}
    volumes:
      - ./scripts/backup:/usr/local/bin:ro
      - imsda_events_backups:/backups
    entrypoint: ["sh", "/usr/local/bin/backup-scheduler.sh"]
    restart: unless-stopped

volumes:
  imsda_events_postgres:
  # Bind this to off-host storage, or set BACKUP_OFFSITE_COMMAND. A dump on the
  # same host as the database it came from does not survive losing that host.
  imsda_events_backups:
