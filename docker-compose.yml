# Variables the deployment cannot run without are guarded with `?` below, so a
# missing one stops `docker compose up` in a second with the variable named.
# Without the guard the stack builds for minutes and then reports only
# "container ... is unhealthy", with the real reason buried in the app log.
#
# `?` (unset) rather than `:?` (unset or blank) is deliberate: a blank value is
# caught by the application's own startup contract in lib/env.ts, which reports
# every offending variable at once, and `.env.example` ships these keys blank
# for local work.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: imsda_events
      POSTGRES_USER: imsda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?set this in the deployment environment; it is the database superuser password}
    volumes:
      - imsda_events_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imsda -d imsda_events"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://imsda:${POSTGRES_PASSWORD}@postgres:5432/imsda_events?schema=public
      APP_BASE_URL: ${APP_BASE_URL?set this to the public https origin; it is written into emailed links}
      MANAGE_LINK_DERIVATION_SECRET: ${MANAGE_LINK_DERIVATION_SECRET?set this to at least 32 random characters (openssl rand -base64 48)}
      MANAGE_LINK_DERIVATION_SECRET_PREVIOUS: ${MANAGE_LINK_DERIVATION_SECRET_PREVIOUS:-}
      ATTENDEE_PASS_SIGNING_SECRET: ${ATTENDEE_PASS_SIGNING_SECRET?set this to at least 32 random characters (openssl rand -base64 48)}
      ATTENDEE_PASS_SIGNING_SECRET_PREVIOUS: ${ATTENDEE_PASS_SIGNING_SECRET_PREVIOUS:-}
      RATE_LIMIT_HASH_SECRET: ${RATE_LIMIT_HASH_SECRET?set this to at least 32 random characters (openssl rand -base64 48)}
      RATE_LIMIT_TRUSTED_PROXY_HOPS: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:-1}
      RATE_LIMIT_CLIENT_IP_HEADER: ${RATE_LIMIT_CLIENT_IP_HEADER:-x-forwarded-for}
      EMBED_ALLOWED_ORIGINS: ${EMBED_ALLOWED_ORIGINS:-}
      # Activation and password-reset email have no manual substitute at scale,
      # so these two are required in production rather than optional.
      RESEND_API_KEY: ${RESEND_API_KEY?set this to a Resend API key; account email has no other path}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      ACCOUNT_EMAIL_SENDER_NAME: ${ACCOUNT_EMAIL_SENDER_NAME:-IMSDA Events}
      ACCOUNT_EMAIL_SENDER_ADDRESS: ${ACCOUNT_EMAIL_SENDER_ADDRESS?set this to a sender address verified with Resend}
      ACCOUNT_EMAIL_REPLY_TO: ${ACCOUNT_EMAIL_REPLY_TO:-}
      # Seals the TOTP secrets behind two-factor authentication. Changing it
      # makes every enrolled authenticator unreadable.
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY?set this to at least 32 random characters (openssl rand -base64 48)}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_REPEAT_MINUTES: ${ALERT_REPEAT_MINUTES:-60}
      PASSWORD_BREACH_CHECK: ${PASSWORD_BREACH_CHECK:-}
      PASSWORD_BREACH_CHECK_URL: ${PASSWORD_BREACH_CHECK_URL:-https://api.pwnedpasswords.com/range/}
      SQUARE_ENVIRONMENT: ${SQUARE_ENVIRONMENT:-sandbox}
      SQUARE_APPLICATION_ID: ${SQUARE_APPLICATION_ID:-}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-}
      SQUARE_API_URL: ${SQUARE_API_URL:-https://connect.squareupsandbox.com}
      SQUARE_API_VERSION: ${SQUARE_API_VERSION:-2026-07-15}
      SQUARE_WEBHOOK_SIGNATURE_KEY: ${SQUARE_WEBHOOK_SIGNATURE_KEY:-}
      SQUARE_WEBHOOK_NOTIFICATION_URL: ${SQUARE_WEBHOOK_NOTIFICATION_URL:-}
      SQUARE_ENABLE_PRODUCTION: ${SQUARE_ENABLE_PRODUCTION:-false}
      # New requirement. An existing deployment that has never set this will not
      # start until it is added — the sweep endpoint is never open by omission.
      OUTBOX_SWEEP_TOKEN: ${OUTBOX_SWEEP_TOKEN?set this to at least 32 random characters (openssl rand -base64 48); it authorises the scheduled outbox sweep}
    ports:
      - "${APP_PORT:-3100}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # Nothing else sweeps the outbox on a timer. Without this, a message that
  # fails its first attempt waits for a staff member to open Communications.
  outbox-sweeper:
    image: curlimages/curl:8.11.1
    depends_on:
      app:
        condition: service_healthy
    environment:
      OUTBOX_SWEEP_TOKEN: ${OUTBOX_SWEEP_TOKEN}
      OUTBOX_SWEEP_URL: http://app:3000/api/internal/outbox/sweep
      OUTBOX_SWEEP_INTERVAL_SECONDS: ${OUTBOX_SWEEP_INTERVAL_SECONDS:-300}
    volumes:
      - ./scripts/outbox-sweep.sh:/usr/local/bin/outbox-sweep.sh:ro
    entrypoint: ["sh", "/usr/local/bin/outbox-sweep.sh"]
    restart: unless-stopped

  # Nightly pg_dump with retention, plus a periodic restore into a scratch
  # database. A backup that has never been restored is not a backup.
  backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: imsda
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: imsda_events
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_VERIFY_EVERY: ${BACKUP_VERIFY_EVERY:-7}
      # Optional. Receives the dump path as $$1, e.g. "rclone copy $$1 remote:imsda".
      BACKUP_OFFSITE_COMMAND: ${BACKUP_OFFSITE_COMMAND:-}
    volumes:
      - ./scripts/backup:/usr/local/bin:ro
      - imsda_events_backups:/backups
    entrypoint: ["sh", "/usr/local/bin/backup-scheduler.sh"]
    restart: unless-stopped

volumes:
  imsda_events_postgres:
  # Bind this to off-host storage, or set BACKUP_OFFSITE_COMMAND. A dump on the
  # same host as the database it came from does not survive losing that host.
  imsda_events_backups:
